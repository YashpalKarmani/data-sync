# Save this file in your GitHub repo as:  .github/workflows/sync.yml
# Secrets to add (repo -> Settings -> Secrets and variables -> Actions -> New repository secret):
#   FS_SYSCODE      Huawei Northbound system code
#   SHEET_ID        Google Sheet ID
#   GOOGLE_SA_JSON  full contents of the service-account .json file
# Optional secrets: FS_USER (default google_sheets_sync), FS_BASE

name: solar-sync

on:
  schedule:
    - cron: "*/15 * * * *"   # live: every 15 minutes (GitHub uses UTC, which does not matter for an interval)
    - cron: "55 18 * * *"    # daily: 18:55 UTC = 23:55 Pakistan time
  workflow_dispatch:
    inputs:
      mode:
        description: "live, daily or all"
        default: "live"

concurrency:
  group: solar-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "55 18 * * *" ]; then
            echo "value=daily" >> "$GITHUB_OUTPUT"
          else
            echo "value=live" >> "$GITHUB_OUTPUT"
          fi

      - name: Run sync
        env:
          FS_USER: ${{ secrets.FS_USER }}
          FS_SYSCODE: ${{ secrets.FS_SYSCODE }}
          FS_BASE: ${{ secrets.FS_BASE }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python sync.py "${{ steps.mode.outputs.value }}"
